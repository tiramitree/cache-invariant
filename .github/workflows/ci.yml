name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install quality dependencies
        run: python -m pip install ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check --no-cache src tests tools
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Test
        run: python -m pytest -q
      - name: Scan source privacy boundary
        run: python tools/privacy_scan.py

  distributions:
    name: Distribution boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependency
        run: python -m pip install "build==1.3.0"
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify distribution contents
        run: python tools/check_dist.py

  real-runtime:
    name: Exact b10107 integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime adapter and conversion lane
        run: python -m pip install ".[convert]"
      - name: Run exact integration without publishing evidence
        shell: pwsh
        run: |
          $pinRoot = Join-Path $env:RUNNER_TEMP "cache-invariant-pins"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "cache-invariant-evidence"
          python -m cache_invariant fetch --destination $pinRoot
          python -m cache_invariant convert --lock (Join-Path $pinRoot "runtime-lock.json")
          python -m cache_invariant run `
            --lock (Join-Path $pinRoot "runtime-lock.json") `
            --output $evidenceRoot `
            --source-revision $env:GITHUB_SHA
          python -m cache_invariant verify $evidenceRoot
      # Intentionally no upload-artifact step: generated candidate evidence,
      # runtime archives, fixture inputs, and GGUF remain ephemeral.
